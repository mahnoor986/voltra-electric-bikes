<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="./cssFiles/bikesstyle.css" rel="stylesheet" />
    <title>BIKES</title>
  </head>

  <body>
    <!-- NAVBAR START  -->

    <div class="container mb-6">
      <header class="absolute inset-x-0 top-0 z-50">
        <nav
          aria-label="Global"
          class="flex bg-black items-center justify-between lg:px-8"
        >
          <div class="flex lg:flex-1">
            <a href="#" class="-m-1.5 p-1.5">
              <span class="sr-only">Your Company</span>
              <img src="./media/images/logo.png" alt="" class="h-25 w-auto" />
            </a>
          </div>
          <div class="flex lg:hidden">
            <button
              type="button"
              command="show-modal"
              commandfor="mobile-menu"
              class="-m-2.5 inline-flex items-center justify-center rounded-md p-2.5 text-gray-700"
            >
              <span class="sr-only">Open main menu</span>
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="1.5"
                data-slot="icon"
                aria-hidden="true"
                class="size-6"
              >
                <path
                  d="M3.75 6.75h16.5M3.75 12h16.5m-16.5 5.25h16.5"
                  stroke-linecap="round"
                  stroke-linejoin="round"
                />
              </svg>
            </button>
          </div>
          <div class="hidden lg:flex lg:gap-x-5">
            <a
              href="/"
              class="mozillaFont hover:text-black hover:bg-lime-300 hover:rounded-full hover:px-2 hover:py-2 text-white"
              >HOME</a
            >
            <a
              href="/bikes"
              class="mozillaFont hover:text-black hover:bg-lime-300 hover:rounded-full hover:px-2 hover:py-2 text-lime-300"
              >BIKES</a
            >
            <a
              href="/technology"
              class="mozillaFont hover:text-black hover:bg-lime-300 hover:rounded-full hover:px-2 hover:py-2 text-white"
              >TECHNOLOGY</a
            >
            <a
              href="/about"
              class="mozillaFont hover:text-black hover:bg-lime-300 hover:rounded-full hover:px-2 hover:py-2 text-white"
              >ABOUT</a
            >
            <a
              href="/contact"
              class="mozillaFont hover:text-black hover:bg-lime-300 hover:rounded-full hover:px-2 hover:py-2 text-white"
              >CONTACT</a
            >
            <a
              href="/references"
              class="mozillaFont hover:text-black hover:bg-lime-300 hover:rounded-full hover:px-2 hover:py-2 text-white"
              >REFERENCES</a
            >
          </div>
          <div class="hidden lg:mr-2 lg:flex lg:flex-1 lg:justify-end">
            <a
              href="/contact"
              class="text-sm/6 px-5 py-2.5 rounded-full mozillaFont bg-transparent hover:bg-lime-300 hover:text-black border-2 border-lime-300 text-lime-300 font-semibold text-black"
              >BOOK NOW <span aria-hidden="true">&rarr;</span></a
            >
          </div>
        </nav>
        <el-dialog>
          <dialog id="mobile-menu" class="backdrop:bg-transparent lg:hidden">
            <div tabindex="0" class="fixed inset-0 focus:outline-none">
              <el-dialog-panel
                class="fixed inset-y-0 right-0 z-50 w-full overflow-y-auto bg-black p-6 sm:max-w-sm sm:ring-1 sm:ring-gray-900/10"
              >
                <div class="flex items-center justify-between">
                  <a href="#" class="-m-1.5 p-1.5">
                    <span class="sr-only">Your Company</span>
                    <img
                      src="./media/images/logo.png"
                      alt=""
                      class="h-17 w-auto"
                    />
                  </a>
                  <button
                    type="button"
                    command="close"
                    commandfor="mobile-menu"
                    class="-m-2.5 rounded-md p-2.5 text-gray-700"
                  >
                    <span class="sr-only">Close menu</span>
                    <svg
                      viewBox="0 0 24 24"
                      fill="none"
                      stroke="currentColor"
                      stroke-width="1.5"
                      data-slot="icon"
                      aria-hidden="true"
                      class="size-6"
                    >
                      <path
                        d="M6 18 18 6M6 6l12 12"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                      />
                    </svg>
                  </button>
                </div>
                <div class="mt-6 flow-root">
                  <div class="-my-6 divide-y divide-gray-500/10">
                    <div class="space-y-2 py-6">
                      <a
                        href="#"
                        class="-mx-3 mozillaFont block rounded-lg px-3 py-2 text-base/7 font-semibold text-white hover:text-black hover:bg-lime-300"
                        >HOME</a
                      >
                      <a
                        href="/bikes"
                        class="-mx-3 mozillaFont block rounded-lg px-3 py-2 text-base/7 font-semibold text-white hover:text-black hover:bg-lime-300"
                        >BIKES</a
                      >
                      <a
                        href="/technology"
                        class="-mx-3 mozillaFont block rounded-lg px-3 py-2 text-base/7 font-semibold text-white hover:text-black hover:bg-lime-300"
                        >TECHNOLOGY</a
                      >
                      <a
                        href="/about"
                        class="-mx-3 mozillaFont block rounded-lg px-3 py-2 text-base/7 font-semibold text-white hover:text-black hover:bg-lime-300"
                        >ABOUT</a
                      >
                      <a
                        href="/contact"
                        class="-mx-3 mozillaFont block rounded-lg px-3 py-2 text-base/7 font-semibold text-white hover:text-black hover:bg-lime-300"
                        >CONTACT</a
                      >
                      <a
                        href="/references"
                        class="-mx-3 mozillaFont block rounded-lg px-3 py-2 text-base/7 font-semibold text-white hover:text-black hover:bg-lime-300"
                        >REFERENCES</a
                      >
                    </div>
                    <div class="py-6">
                      <a
                        href="/contact now"
                        class="lg:-mx-3 mozillaFont block rounded-lg py-3 text-base/3 mx-20 text-center font-semibold text-black hover:text-white sm:bg-lime-300 hover:bg-lime-400"
                        >BOOK NOW</a
                      >
                    </div>
                  </div>
                </div>
              </el-dialog-panel>
            </div>
          </dialog>
        </el-dialog>
      </header>
    </div>

    <!-- NAVBAR END  -->
<section class="text-gray-600 bg-lime-300 body-font">

  <div class="container px-5 py-20 mx-auto">

    <div class="relative">

      <!-- LEFT ARROW -->
      <button
        id="prevBike"
        type="button"
        class="absolute -left-5 top-1/2 z-30
        -translate-y-1/2
        flex h-10 w-10 items-center justify-center
        rounded-full bg-black
        text-xl text-lime-300
        shadow-lg
        hover:bg-lime-300 hover:text-black"
      >
        ←
      </button>


      <!-- SLIDER WINDOW -->
      <div class="overflow-hidden w-full">

        <!-- SLIDER TRACK -->
        <div
          id="bikeTrack"
          class="flex w-full transition-transform duration-700 ease-in-out"
        ></div>

      </div>


      <!-- RIGHT ARROW -->
      <button
        id="nextBike"
        type="button"
        class="absolute -right-5 top-1/2 z-30
        -translate-y-1/2
        flex h-10 w-10 items-center justify-center
        rounded-full bg-black
        text-xl text-lime-300
        shadow-lg
        hover:bg-lime-300 hover:text-black"
      >
        →
      </button>

    </div>

  </div>

</section>

    <script src="./script.js"></script>
  </body>
</html>
